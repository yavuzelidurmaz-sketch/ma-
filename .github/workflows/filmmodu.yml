name: FilmModu Scraper

on:
  workflow_dispatch: # Manuel tetikleme butonu
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalış

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Chrome Tarayıcıyı Kur
        uses: browser-actions/setup-chrome@latest

      # KRİTİK ADIM: Gerekli kütüphaneleri yükle
      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 requests

      - name: Botu Çalıştır
        run: python scraper3.py

      - name: Kaydet ve Gönder (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Film listesi ve linkler güncellendi"
          file_pattern: "data/*"
          branch: main
