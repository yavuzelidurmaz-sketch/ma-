name: Fanatik Arşiv Güncelleyici

on:
  schedule:
    - cron: '0 2 * * *' # Her gece 02:00
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write # Yazma izni şart

jobs:
  scrape_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          # cache: 'pip' satırını kaldırdık, hata buna sebep oluyordu.

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Botu Çalıştır
        run: python diziyou_bot.py

      - name: Klasör Kontrolü
        run: |
          ls -R data/ || echo "Data klasörü bulunamadı veya boş!"

      - name: Dosyaları GitHub'a Yükle (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git add data/
          
          git commit -m "Otomatik Arşiv Güncellemesi: $(date +'%Y-%m-%d')" || echo "Değişiklik yok, commit atlanıyor."
          
          git push
