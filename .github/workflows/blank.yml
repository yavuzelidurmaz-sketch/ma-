name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager

      - name: Run Scraper
        run: python scraper.py

      - name: List files (Debug)
        run: ls -la

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f channels.json ]; then
            git add channels.json playlist.m3u
            git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: $(date +'%Y-%m-%d %H:%M')" && git push)
          else
            echo "Dosyalar oluşturulmamış, commit atlanıyor."
          fi
